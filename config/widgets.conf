# Copiado para ~/.config/thinkpad-monitor/widgets.conf pelo install.sh.
#
# Cores dos widgets, no formato #RRGGBB. Apague uma linha para que aquela cor
# volte a ser derivada do acento do painel Aparência do COSMIC.
#
# Estes valores vêm do wallpaper twilight-journey: o roxo das nuvens, o vermelho
# do banco do trem e as sombras. As barras vão de PRIMARY_COLOR até SECONDARY_COLOR.

# Ícones e início das barras.
PRIMARY_COLOR=#B57BFF

# Fim das barras, gráfico de temperatura e upload.
SECONDARY_COLOR=#FF4D6D

# Swap e download.
COOL_COLOR=#E27BFF

# Tinta do vidro dos cartões. Use uma cor escura para manter o texto legível.
GLASS_COLOR=#1C0A24
